name: Preview Release (testers only)

# Tag-only preview packaging for internal testers.
#
# Trigger with a semver prerelease tag equal to package.json, for example:
#   0.68.0-preview.5
#
# This workflow intentionally creates a GitHub prerelease, never a stable
# `v*` release. Stable apps use `latest*.yml` and GitHub's latest stable tag;
# preview apps opt into the `preview*.yml` prerelease feed. A semver tag is
# required so electron-updater can select the `preview` channel from Atom.

on:
  push:
    tags:
      - "*-preview.*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify-source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Version tag must match package.json
        id: version
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version $VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi
          node -e '
            const v = process.argv[1];
            const match = /^(\d+)\.(\d+)\.(\d+)-preview\.\d+$/.exec(v);
            if (!match) {
              console.error(`::error::preview version ${v} must match X.Y.Z-preview.N`);
              process.exit(1);
            }
            const [major, minor, patch] = match.slice(1).map(Number);
            const greaterThan054 = major > 0 || minor > 54 || (minor === 54 && patch > 0);
            if (!greaterThan054) {
              console.error(`::error::preview version ${v} must be > 0.54.0`);
              process.exit(1);
            }
          ' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ preview version $VERSION"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: P0 regression pins
        run: |
          CODEX_DISABLED=1 npx tsx --test --import ./src/__tests__/db-isolation.setup.ts \
            src/__tests__/unit/codex-binary-discovery.test.ts \
            src/__tests__/unit/provider-resolver.test.ts \
            src/__tests__/unit/codex-app-server-client.test.ts

  build-macos-arm64:
    name: Build macOS arm64 + x64 + universal updater
    needs: verify-source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure fail-closed Apple notarization credentials
        env:
          APPLE_NOTARIZATION_KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_NOTARIZATION_KEY_BASE64" ] || { echo "::error::APPLE_NOTARIZATION_KEY_BASE64 is required"; exit 1; }
          [ -n "$NOTARY_KEY_ID" ] || { echo "::error::APPLE_API_KEY_ID is required"; exit 1; }
          [ -n "$NOTARY_ISSUER" ] || { echo "::error::APPLE_API_ISSUER is required"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_CodePilot.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$NOTARY_ISSUER" >> "$GITHUB_ENV"

      - name: Build macOS preview bundles
        timeout-minutes: 30
        env:
          CODEPILOT_APP_CHANNEL: preview
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
        run: npm run electron:build

      - name: Package native macOS preview assets (arm64 + x64)
        timeout-minutes: 45
        env:
          CODEPILOT_APP_CHANNEL: preview
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CODEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODEPILOT_REQUIRE_DEVELOPER_ID: "1"
        run: |
          npx electron-builder --mac --arm64 --x64 --config electron-builder.yml -c.publish.channel=preview --publish never

      - name: Package universal macOS preview updater
        timeout-minutes: 45
        env:
          CODEPILOT_APP_CHANNEL: preview
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CODEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODEPILOT_REQUIRE_DEVELOPER_ID: "1"
        run: npx electron-builder --mac --universal --config electron-builder.yml -c.publish.channel=preview --publish never

      - name: Notarize and staple preview DMG
        timeout-minutes: 45
        run: node scripts/notarize-macos-dmgs.mjs release 3

      - name: Verify packaged version, native ABI, and server startup
        env:
          CODEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-source.outputs.version }}"
          for ARCH in arm64 x64; do
            DMG=$(find release -name "CodePilot-*-${ARCH}.dmg" | head -1)
            [ -n "$DMG" ] || { echo "::error::no ${ARCH} DMG produced"; exit 1; }
            case "$DMG" in *"$VERSION"*) ;; *) echo "::error::${ARCH} DMG name lacks $VERSION"; exit 1 ;; esac
          done
          APP=$(find release -maxdepth 4 -path "*mac-arm64*" -name "CodePilot.app" -type d | head -1)
          node scripts/verify-macos-developer-id.mjs release 3
          node scripts/verify-macos-notarization.mjs release 3
          PLIST_VER=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          [ "$PLIST_VER" = "$VERSION" ] || { echo "::error::Info.plist $PLIST_VER != $VERSION"; exit 1; }
          SQLITE=$(find "$APP/Contents/Resources" -path "*better-sqlite3*" -name "*.node" | head -1)
          [ -n "$SQLITE" ] || { echo "::error::better-sqlite3 .node not found"; exit 1; }
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/CodePilot" -e "const path = require('node:path'); require(path.resolve(process.argv[1])); console.log('better-sqlite3 OK, ABI=' + process.versions.modules)" "$SQLITE"
          node scripts/verify-packaged-server.mjs "$APP/Contents/MacOS/CodePilot" "$APP/Contents/Resources"
          node scripts/verify-electron-main-health.mjs "$APP/Contents/MacOS/CodePilot"

      - name: Checksums
        run: |
          cd release
          find . -maxdepth 1 -type f \( -name 'CodePilot-*.dmg' -o -name 'CodePilot-*.zip' -o -name '*.blockmap' -o -name 'preview-mac.yml' \) -print0 \
            | sort -z | xargs -0 shasum -a 256 | tee checksums-macos.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: preview-macos
          path: |
            release/CodePilot-*.dmg
            release/CodePilot-*.zip
            release/CodePilot-*.blockmap
            release/preview-mac.yml
            release/checksums-macos.sha256
          retention-days: 7

  build-windows-x64:
    needs: verify-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure fail-closed Windows signing credentials
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)) { throw 'WINDOWS_CERT_PFX_BASE64 is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) { throw 'WINDOWS_CERT_PASSWORD is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER_SUBJECT)) { throw 'WINDOWS_PUBLISHER_SUBJECT repository variable is required' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'codepilot-windows-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CODEPILOT_WINDOWS_PUBLISHER_SUBJECT=$($env:WINDOWS_PUBLISHER_SUBJECT)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build + package Windows x64
        timeout-minutes: 35
        env:
          CODEPILOT_APP_CHANNEL: preview
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          npm run electron:build
          npx electron-builder --win --x64 --config electron-builder.yml -c.publish.channel=preview --publish never

      - name: Verify packaged version, native ABI, and server startup
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-source.outputs.version }}"
          EXE=$(find release -name "CodePilot.Setup.*.exe" | head -1)
          [ -n "$EXE" ] || { echo "::error::no NSIS installer produced"; exit 1; }
          case "$EXE" in *"$VERSION"*) ;; *) echo "::error::installer name lacks $VERSION"; exit 1 ;; esac
          SQLITE=$(find release/win-unpacked -path "*better-sqlite3*" -name "*.node" 2>/dev/null | head -1)
          [ -n "$SQLITE" ] || { echo "::error::better-sqlite3 .node not found"; exit 1; }
          BIN=$(find release/win-unpacked -maxdepth 1 -name "CodePilot.exe" | head -1)
          ELECTRON_RUN_AS_NODE=1 "$BIN" -e "const path = require('node:path'); require(path.resolve(process.argv[1])); console.log('better-sqlite3 OK, ABI=' + process.versions.modules)" "$SQLITE"
          node scripts/verify-packaged-server.mjs "$BIN" "$(dirname "$BIN")/resources"
          node scripts/verify-electron-main-health.mjs "$BIN"

      - name: Verify Authenticode publisher and RFC3161 timestamp
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1 -ReleaseRoot release -ExpectedSubject $env:CODEPILOT_WINDOWS_PUBLISHER_SUBJECT

      - name: Checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f \( -name 'CodePilot.Setup.*.exe' -o -name 'CodePilot.Setup.*.exe.blockmap' -o -name 'preview.yml' \) -print0 \
            | sort -z | xargs -0 sha256sum | tee checksums-windows-x64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows-x64
          path: |
            release/CodePilot.Setup.*.exe
            release/CodePilot.Setup.*.exe.blockmap
            release/preview.yml
            release/checksums-windows-x64.sha256
          retention-days: 7

  create-prerelease:
    needs: [verify-source, build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release notes and checksums
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-source.outputs.version }}"
          {
            echo "## CodePilot ${VERSION} internal preview"
            echo ""
            echo "This is a tester-only prerelease from the refactor branch."
            echo ""
            echo "- Not a stable \`v*\` release."
            echo "- Marked as GitHub prerelease and \`--latest=false\`."
            echo "- Preview builds use the signed \`preview*.yml\` prerelease channel and can update only to newer preview builds."
            echo ""
            echo "### Test focus"
            echo "- Existing data compatibility after installing over 0.54.x or older preview packages."
            echo "- Codex runtime startup and model loading."
            echo "- Claude Code runtime model loading and first message."
            echo "- macOS tray icon visibility in light/dark mode."
            echo "- Windows command generation uses PowerShell by default."
            echo ""
            echo "### Report P0/P1 issues with"
            echo "- OS version and CPU architecture."
            echo "- CodePilot version shown in About."
            echo "- Runtime selected and model/provider."
            echo "- Repro steps, screenshot, and logs when available."
          } > release-notes.md

          echo "## SHA-256 Checksums" > SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          for cs in artifacts/checksums-*.sha256; do
            [ -f "$cs" ] || continue
            cat "$cs" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

          node scripts/verify-update-assets.mjs artifacts "$VERSION" preview

      - name: List release assets
        run: find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.blockmap" -o -name "preview*.yml" \) -print | sort

      - name: Attest every preview release asset
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/CodePilot-*
            artifacts/CodePilot.Setup.*
            artifacts/preview*.yml
            SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CodePilot ${{ needs.verify-source.outputs.version }} internal preview
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/preview*.yml
            SHA256SUMS.txt
